<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stu-Nurse Portal</title>
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/global.css">
</head>
<body class="login-body" style="background-image: url('./assets/shiba-index.jpg');">
  <div class="login-overlay"></div>

  <!-- Theme Selector Dropdown (Top Right Corner) -->
  <div style="position: absolute; top: 20px; right: 20px; z-index: 1000;" id="theme-dropdown-container">
    <button id="theme-menu-btn" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(30, 41, 59, 0.85); border: 1px solid #475569; border-radius: 8px; color: #f8fafc; font-size: 12px; cursor: pointer;">
      <span id="theme-current-icon">💻</span>
      <span id="theme-current-label">Device Default</span>
    </button>

    <div id="theme-dropdown-menu" style="display: none; position: absolute; right: 0; margin-top: 8px; width: 160px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); padding: 6px; z-index: 50; font-size: 12px; color: #f8fafc;">
      <button data-theme="light" style="width: 100%; text-align: left; padding: 8px 12px; background: none; border: none; color: #f8fafc; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='none'">
        <span>☀️</span> Light Theme
      </button>
      <button data-theme="dark" style="width: 100%; text-align: left; padding: 8px 12px; background: none; border: none; color: #f8fafc; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px;" onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='none'">
        <span>🌙</span> Dark Theme
      </button>
      <button data-theme="system" style="width: 100%; text-align: left; padding: 8px 12px; background: none; border: none; color: #f8fafc; cursor: pointer; border-radius: 6px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #334155; margin-top: 4px; padding-top: 8px;" onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='none'">
        <span>💻</span> Device Default
      </button>
    </div>
  </div>

  <div class="card glass-login-card">
    <h1>Stu-Nurse</h1>
    <p class="subtitle">Log in or create an account to access your study materials.</p>

    <form id="auth-form" onsubmit="return false;">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>

      <p id="error-message" class="hidden"></p>

      <div class="button-group">
        <button type="button" id="login-btn">Log In</button>
        <button type="button" id="signup-btn">Sign Up</button>
      </div>
    </form>
  </div>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/themeManager.js"></script>
</body>
</html>
